name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Python 3.14
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest

      # 4. Проверяем форматирование (не изменяем файлы, только проверяем)
      - name: Check code formatting with Black
        run: black --check src/

      # 5. Запускаем линтер
      - name: Run flake8
        run: flake8 src/

      # 6. Запускаем тесты
      - name: Run tests
        run: python -m pytest src/tests/ -v