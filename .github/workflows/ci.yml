name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black pytest Flask

      - name: Check code formatting with Black
        run: black --check src/

      - name: Run flake8
        run: flake8 src/

      - name: Run tests
        run: python -m pytest src/tests/ -v

  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/smart-todo-app:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/smart-todo-app:${{ github.sha }}

  deploy-to-local:
    needs: build-and-push
    runs-on: self-hosted   # ← ВАЖНО: используем локальную машину!
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest image from GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/${{ github.repository_owner }}/smart-todo-app:${{ github.sha }}

      - name: Stop old container
        run: |
          if docker ps -q -f name=smart-todo-app; then
            docker stop smart-todo-app
            docker rm smart-todo-app
          fi

      - name: Start new container
        run: |
          docker run -d \
            --name smart-todo-app \
            -p 5000:5000 \
            -v /home/runner/work/smart-todo-app/smart-todo-app/src:/app/src \
            ghcr.io/${{ github.repository_owner }}/smart-todo-app:${{ github.sha }}