name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black pytest Flask

      - name: Check code formatting with Black
        run: black --check src/

      - name: Run flake8
        run: flake8 src/

      - name: Run tests
        run: python -m pytest src/tests/ -v

 